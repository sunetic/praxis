groups:
  - name: mysql-demo
    rules:
      - alert: MySQLConnectionPressure
        expr: |
          mysql_global_status_threads_connected{job="mysql-demo"}
          / mysql_global_variables_max_connections{job="mysql-demo"} > 0.5
        for: 20s
        labels:
          severity: warning
          cluster_key: mysql-prometheus-demo
        annotations:
          summary: MySQL connections exceed 50 percent of the configured limit
          description: The demo workload keeps connection utilization high so database and monitoring evidence can be correlated.
