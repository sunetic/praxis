global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus-demo
    static_configs:
      - targets: ["prometheus-demo:9090"]

  - job_name: mysql-demo
    static_configs:
      - targets: ["mysql-exporter-demo:9104"]
