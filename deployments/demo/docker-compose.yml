name: ${PRAXIS_DEMO_PROJECT:-praxis-demo}

services:
  praxis-demo:
    build:
      context: ../..
      dockerfile: Dockerfile
      args: &demo-build-args
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        LITELLM_WHEEL_URL: ${LITELLM_WHEEL_URL:-https://files.pythonhosted.org/packages/1c/38/e6a4abb062e039d18d59538cc4e6fc370c2c10cd2bff4a2e546acb69dcb9/litellm-1.85.0-py3-none-any.whl}
    image: praxis-demo:local
    environment:
      PRAXIS_DEMO_BOOTSTRAP: "true"
      DEMO_MYSQL_APP_PASSWORD: ${DEMO_MYSQL_APP_PASSWORD:-praxis-demo-app}
    ports:
      - "127.0.0.1:${PRAXIS_DEMO_PORT:-8000}:8000"
    volumes:
      - praxis_demo_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mysql-demo:
    image: mysql:8.4.11
    command: ["--max-connections=24", "--performance-schema=ON"]
    environment:
      # Demo-only credentials. Published ports are restricted to 127.0.0.1.
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-praxis-demo-root}
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DEMO_MYSQL_APP_PASSWORD:-praxis-demo-app}
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/10-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  cadvisor-demo:
    image: ghcr.io/google/cadvisor:v0.60.6
    cgroup: host
    command:
      - --containerd-namespace=default
    ports:
      - "127.0.0.1:${DEMO_CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  prometheus-demo:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
    ports:
      - "127.0.0.1:${DEMO_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_demo_data:/prometheus
    depends_on:
      - cadvisor-demo
    restart: unless-stopped

  demo-init:
    # Build the same image used by praxis-demo. With `compose run --build`,
    # this prevents a current init.py from being paired with a cached backend.
    build:
      context: ../..
      dockerfile: Dockerfile
      args: *demo-build-args
    image: praxis-demo:local
    entrypoint: ["python", "/demo/init.py"]
    environment:
      PRAXIS_API_URL: http://praxis-demo:8000/api/v1
      PRAXIS_DEMO_PORT: ${PRAXIS_DEMO_PORT:-8000}
      DEMO_MYSQL_APP_PASSWORD: ${DEMO_MYSQL_APP_PASSWORD:-praxis-demo-app}
      DEMO_MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-praxis-demo-root}
      DEMO_MYSQL_PORT: ${DEMO_MYSQL_PORT:-3308}
      DEMO_PROMETHEUS_PORT: ${DEMO_PROMETHEUS_PORT:-9090}
      DEMO_CADVISOR_PORT: ${DEMO_CADVISOR_PORT:-8080}
    volumes:
      - ./init.py:/demo/init.py:ro
    depends_on:
      praxis-demo:
        condition: service_healthy
      mysql-demo:
        condition: service_healthy
      prometheus-demo:
        condition: service_started
      cadvisor-demo:
        condition: service_started
    restart: "on-failure:5"

volumes:
  praxis_demo_data:
  mysql_demo_data:
  prometheus_demo_data:
